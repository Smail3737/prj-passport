name: CI Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run SAST
        run: semgrep scan --config auto --error --exclude '.github/workflows/**' .

  sca:
    name: SCA - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SCA
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  secrets:
    name: Secrets Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  secret-injection:
    name: Secret Injection Test
    runs-on: ubuntu-latest

    steps:
      - name: Check injected secret
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -z "$DEMO_API_TOKEN" ]; then
            echo "Secret is missing"
            exit 1
          fi

          echo "Secret injected successfully"

  aws-secret-test:
    name: AWS OIDC + Secrets Manager
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::658606185886:role/GitHubActionsReadDemoSecret
          aws-region: eu-north-1

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Read secret from Secrets Manager
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dev/demo/api-token \
            --query SecretString \
            --output text)

          if [ -z "$SECRET" ]; then
            echo "Secret is missing"
            exit 1
          fi

          echo "AWS secret retrieved successfully"

  terraform:
    name: Terraform Security Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz
          tar xzf conftest_0.68.2_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Policy as Code - OPA
        run: |
          conftest test terraform/main.tf \
            --policy policy \
            --parser hcl2

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Check SBOM
        run: |
          test -f sbom.cdx.json
          echo "SBOM generated successfully"
          head -n 30 sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  backup-restore-test:
    name: Backup Restore Test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      BUCKET: devsecops-backup-lab-658606185886
      KEY: restore-test-${{ github.run_id }}.txt

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::658606185886:role/GitHubActionsBackupRestoreTest
          aws-region: eu-north-1

      - name: Upload Version 1
        run: |
          echo "Version 1" > backup.txt
          aws s3 cp backup.txt s3://$BUCKET/$KEY

      - name: Upload Version 2
        run: |
          echo "Version 2" > backup.txt
          aws s3 cp backup.txt s3://$BUCKET/$KEY

      - name: Simulate accidental deletion
        run: |
          DELETE_MARKER_VERSION=$(aws s3api delete-object \
            --bucket "$BUCKET" \
            --key "$KEY" \
            --query VersionId \
            --output text)

          if [ -z "$DELETE_MARKER_VERSION" ] || [ "$DELETE_MARKER_VERSION" = "None" ]; then
            echo "Delete marker was not created"
            exit 1
          fi

          echo "Delete marker created: $DELETE_MARKER_VERSION"
          echo "DELETE_MARKER_VERSION=$DELETE_MARKER_VERSION" >> "$GITHUB_ENV"

      - name: Restore object
        run: |
          aws s3api delete-object \
            --bucket "$BUCKET" \
            --key "$KEY" \
            --version-id "$DELETE_MARKER_VERSION"

          echo "Delete marker removed"

      - name: Verify restored backup
        run: |
          aws s3 cp s3://$BUCKET/$KEY restored.txt

          if grep -qx "Version 2" restored.txt; then
            echo "RESTORE TEST PASSED"
          else
            echo "RESTORE TEST FAILED"
            exit 1
          fi
